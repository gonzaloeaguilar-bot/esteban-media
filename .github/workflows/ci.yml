name: CI

on:
  push:
    # `esteban` is his branch — he pushes straight to it, and every push gets a
    # green or red here plus a preview URL. Without it listed, a push to his
    # branch ran NOTHING and the first sign of a problem arrived when a PR was
    # opened, which for someone who is not a developer is far too late to
    # connect the failure to the change that caused it.
    #
    # `esteban/**` too, so a second branch of his own works the same way without
    # anyone editing this file again.
    branches: [main, esteban, "esteban/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
