name: Cortex Quality Required

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

jobs:
  quality-evidence:
    name: Cortex quality evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate PR quality enforcement evidence
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .github/scripts/cortex_pr_quality_evidence.py \
            --allowed-project esteban-media
