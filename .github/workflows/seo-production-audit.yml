# $0 weekly audit of the daily production verifier itself. A separate workflow
# means an audit run can never mask the absence of verifier runs.
name: Production SEO loop audit

on:
  schedule:
    - cron: "05 12 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    name: Weekly SEO loop audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Audit failed, absent, or wasteful verifier runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/audit-seo-verifier-runs.mjs
